name: Deploy Azure
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: production-deployment
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
      - run: node scripts/package-release.mjs
      - name: Install runtime dependencies
        run: npm ci --omit=dev
        working-directory: release
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
          retention-days: 14
  deploy:
    needs: verify-and-build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-${{ github.sha }}
          path: release
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME }}
          package: release
      - name: Verify readiness
        env:
          APP_NAME: ${{ vars.AZURE_WEBAPP_NAME }}
        run: curl --fail --retry 8 --retry-all-errors --retry-delay 10 "https://${APP_NAME}.azurewebsites.net/api/health/ready"
