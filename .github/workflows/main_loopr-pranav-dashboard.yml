name: Quality checks and Azure deployment

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:7.0
        ports: ['27018:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run check
      - run: npm run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-evidence
          path: test-results/
          retention-days: 7

  package:
    if: github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: node scripts/package-release.mjs
      - name: Install runtime dependencies
        run: npm ci --omit=dev
        working-directory: release
      - uses: actions/upload-artifact@v4
        with:
          name: azure-release-${{ github.sha }}
          path: release/
          retention-days: 7

  deploy:
    if: github.event_name != 'pull_request'
    needs: package
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: azure-release-${{ github.sha }}
          path: release
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1BC2C8118EB249AB87FAADB6A4C3ACCE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_82601C4949054B1086104FF8828ED620 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_886D1A4393794C00B60645D1452E5884 }}
      - uses: azure/webapps-deploy@v3
        with:
          app-name: loopr-pranav-dashboard
          slot-name: Production
          package: release
      - name: Verify database readiness
        run: >-
          curl --fail --retry 8 --retry-all-errors --retry-delay 10
          https://loopr-pranav-dashboard-h6gaexeve8e4bqhb.southindia-01.azurewebsites.net/api/health/ready
